<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVAC MATCH</title><style> *{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#17324a;font:16px Arial}header{background:#102b46;color:white;padding:25px}header h1{margin:0;color:#8bd9ff}main{max-width:900px;margin:auto;padding:16px}section{background:white;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #1231}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:12px;border:1px solid #b8c9d5;border-radius:8px;width:100%;background:white}button{background:#12659a;color:white;border:0;margin-top:10px;cursor:pointer}nav{display:flex;gap:6px;margin-bottom:15px}nav button{flex:1;padding:10px 4px}small{color:#526779}article{border:1px solid #d4e0e8;padding:12px;border-radius:9px;margin-top:10px}bdi{font-weight:bold}h2{margin-top:0;font-size:21px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px} [hidden]{display:none!important}</style><header><h1>❄ HVAC MATCH</h1><p>By Maor Shlomo · V1.0</p></header><main><nav><button onclick="tab('match')">התאמה</button><button onclick="tab('catalog')">מאגר</button><button onclick="tab('calc')">מחשבונים</button><button onclick="tab('projects')">פרויקט</button></nav><section id="match"><h2>התאמת ציוד</h2><label>דגם מקורי (אם קיים במאגר)</label><input id="model" placeholder="AJY090LELDH" onchange="identify()"><small id="status"></small><label>סוג ציוד</label><select id="type"><option value="vrf">מעבה VRF</option><option value="wall">מזגן עילי</option><option value="duct">מאייד נסתר</option><option value="cassette">קסטה</option></select><label>יצרן חלופי</label><select id="brand"><option value="all">כל היצרנים</option><option>Fujitsu</option><option>Gree</option></select><div class="pair"><div><label>תפוקת קירור</label><input id="capacity" type="number" min="1" value="95000"></div><div><label>יחידות</label><select id="unit"><option>BTU/h</option><option>kW</option></select></div></div><label>סטייה מותרת (%)</label><input id="tol" type="number" min="0" max="100" value="10"><button onclick="search()">בצע התאמה</button><div id="results"></div></section><section id="catalog" hidden><h2>מאגר דגמים ראשוני</h2><input id="filter" placeholder="חיפוש דגם או יצרן" oninput="catalogue()"><div id="items"></div></section><section id="calc" hidden><h2>מחשבון מהירות אוויר</h2><label>CFM</label><input id="cfm" type="number" value="2000" oninput="calc()"><div class="pair"><div><label>רוחב (ס״מ)</label><input id="width" type="number" value="45" oninput="calc()"></div><div><label>גובה (ס״מ)</label><input id="height" type="number" value="50" oninput="calc()"></div></div><h2 id="velocity"></h2><hr><label>תפוקה BTU/h</label><input id="convert" type="number" value="95000" oninput="calc()"><h2 id="kw"></h2></section><section id="projects" hidden><h2>ציוד שנבחר לפרויקט</h2><label>שם הפרויקט</label><input id="projectName" onchange="save()"><div id="saved"></div><button onclick="exportCSV()">ייצוא CSV לאקסל</button><small id="storage"></small></section><small>מאגר חלקי: 23 דגמים משלושה קטלוגים. התאמה לפי תפוקה וסוג בלבד; יש לאמת לחץ סטטי, ספיקה, מידות, חשמל ותנאי תכנון לפני בחירה.</small></main><script>
const $=id=>document.getElementById(id);const data=[...['120LW/C','140LW/C','160LW/C','224LW/D','280LW/C1','335LW/C1','400LWM/A','450LWM/A','504LWM/A','560LWM/A','615LWM/A'].map((m,i)=>({b:'Gree',m:'IQV-'+m,c:[41300,47800,54600,76400,95500,114300,136500,153500,172000,191100,209800][i],t:'vrf',s:'Gree QLIMATIQ VRF'})),...['040','045','054','072','090','108','126','144','162'].map((m,i)=>({b:'Fujitsu',m:'AJY'+m+'LELDH',c:[41285,47768,52886,76429,95536,114302,136480,153540,170600][i],t:'vrf',s:'Fujitsu AIRSTAGE J-IV'})),...['09','12','14'].map((m,i)=>({b:'Fujitsu',m:'ASEH'+m+'KMCG',c:[8530,11600,14330][i],t:'wall',s:'Fujitsu מפוצלים 2025'}))];let selected=[];try{let p=JSON.parse(localStorage.getItem('hvac-match-v1')||'{}');selected=Array.isArray(p.rows)?p.rows.filter(i=>Number.isInteger(i)&&data[i]):[];$('projectName').value=p.name||''}catch(e){}function tab(t){for(let s of ['match','catalog','calc','projects'])$(s).hidden=s!==t;if(t==='catalog')catalogue();if(t==='calc')calc();if(t==='projects')renderSaved()}
function identify(){let q=$('model').value.trim().toUpperCase(),d=data.find(x=>x.m.toUpperCase()===q);$('status').textContent=d?'דגם זוהה':q?'דגם לא נמצא – הזן תפוקה ידנית':'';if(d){$('capacity').value=d.c;$('unit').value='BTU/h';$('type').value=d.t}return d}function card(d,extra='',action=''){return `<article><bdi>${d.b} · ${d.m}</bdi><p>${d.c.toLocaleString()} BTU/h · ${(d.c/3412.142).toFixed(2)} kW ${extra}</p><small>${d.s}</small>${action}</article>`}function search(){let q=$('model').value.trim().toUpperCase(),v=Number($('capacity').value)*($('unit').value==='kW'?3412.142:1),tol=Number($('tol').value);if(!(v>0&&tol>=0&&tol<=100)){$('results').textContent='יש להזין תפוקה חיובית וסטייה בין 0 ל-100';return}let rows=data.filter(d=>d.t===$('type').value&&($('brand').value==='all'||d.b===$('brand').value)&&d.m.toUpperCase()!==q&&Math.abs(d.c-v)/v*100<=tol).sort((a,b)=>Math.abs(a.c-v)-Math.abs(b.c-v));$('results').innerHTML=rows.length?`<h3>${rows.length} חלופות בטווח</h3>`+rows.map(d=>card(d,` · סטייה ${((d.c-v)/v*100).toFixed(2)}%`,`<button onclick="add(${data.indexOf(d)})">הוסף לפרויקט</button>`)).join(''):'<p>אין התאמה במאגר החלקי.</p>'}function catalogue(){let q=$('filter').value.toLowerCase();$('items').innerHTML=data.filter(d=>(d.b+' '+d.m).toLowerCase().includes(q)).map(d=>card(d)).join('')}function calc(){let f=+$('cfm').value,w=+$('width').value,h=+$('height').value,c=+$('convert').value;$('velocity').textContent=w>0&&h>0&&f>=0?(f*929.0304/(w*h)).toFixed(0)+' FPM':'נתונים לא תקינים';$('kw').textContent=c>=0?(c/3412.142).toFixed(2)+' kW':'נתון לא תקין'}function save(){try{localStorage.setItem('hvac-match-v1',JSON.stringify({name:$('projectName').value,rows:selected}));$('storage').textContent='נשמר בדפדפן המקומי'}catch(e){$('storage').textContent='שמירה קבועה אינה זמינה בדפדפן זה'}}function add(i){selected.push(i);save();alert('נוסף לפרויקט')}function renderSaved(){$('saved').innerHTML=selected.map((i,j)=>card(data[i],'',`<button onclick="selected.splice(${j},1);save();renderSaved()">הסר</button>`)).join('')||'טרם נבחר ציוד'}function exportCSV(){let csv='\ufeffBrand,Model,BTU/h,kW\n'+selected.map(i=>{let d=data[i];return [d.b,d.m,d.c,(d.c/3412.142).toFixed(2)].join(',')}).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='HVAC_MATCH.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}calc();</script></html>
